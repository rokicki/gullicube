name: windows-build
on:
  push:
    branches: [windows-ci]
  workflow_dispatch:
jobs:
  mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: UCRT64, env: ucrt-x86_64, cxx: g++ }
          - { sys: CLANG64, env: clang-x86_64, cxx: clang++ }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: make mingw-w64-${{ matrix.env }}-${{ matrix.cxx == 'g++' && 'gcc' || 'clang' }}
      - run: ${{ matrix.cxx }} --version
      - run: make -k -j4 CXX=${{ matrix.cxx }}
      - run: ls -l gullicube.exe
  clang-cl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build with clang-cl
        shell: pwsh
        run: |
          clang-cl --version
          clang-cl /O2 /std:c++20 /EHsc /Isrc/brob /Isrc/full -w src/full/gullicube.cpp src/full/brobglue.cpp src/brob/xcube.cpp src/brob/cornersolver.cpp src/brob/wingsolver.cpp src/brob/util.cpp src/brob/facelets.cpp /Fegullicube.exe
  msvc:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build with cl (informational; GCC builtins expected to fail)
        shell: pwsh
        run: cl /O2 /std:c++20 /EHsc /Isrc/brob /Isrc/full src/full/gullicube.cpp src/full/brobglue.cpp src/brob/xcube.cpp src/brob/cornersolver.cpp src/brob/wingsolver.cpp src/brob/util.cpp src/brob/facelets.cpp /Fegullicube.exe
